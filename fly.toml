# Fly.io config for the SuperSearch API host.
# Deploy from the repo root:
#   fly launch --no-deploy   # first time only, if needed
#   fly deploy
# Then set your personal site demo URL via SUPERSEARCH_API_BASE or update projects page.

app = "supersearch-api"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  SUPERSEARCH_DATA_DIR = "/app/sample_data"
  SUPERSEARCH_CORS = "*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
